# fly.toml app configuration file generated for playlist-mood-evaluator-api on 2024-08-09T16:07:21-04:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'playlist-mood-evaluator-api'
primary_region = 'ewr'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1

[env]
  ALLOWED_ORIGIN = 'https://playlistmoodevaluator.com'
  APP_DOMAIN = '.playlistmoodevaluator.com'
  SPOTIFY_SCOPE = 'playlist-read-private playlist-read-collaborative user-read-private user-read-email'
  OAUTH_REDIRECT_URI = 'https://playlistmoodevaluator.com/callback'